<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Portal Sim — Rotating Boxes + Portal Keyframes + Intrusion Toggle</title>
<style>
  :root{--bg:#0f1115;--panel:#111520;--muted:#94a3b8;--accent:#3b82f6}
  body{margin:0;background:var(--bg);color:#e2e8f0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;display:flex;justify-content:center;padding:20px;box-sizing:border-box}
  .wrap{width:100%;max-width:1200px;display:flex;gap:18px}
  .sim{flex:1;background:#0b0d13;border-radius:12px;padding:16px;border:2px solid #222a35;box-shadow:0 8px 30px rgba(0,0,0,.6)}
  canvas{width:100%;height:auto;border-radius:8px;display:block;background:#061018}
  .ui{width:360px;background:var(--panel);border-radius:12px;padding:14px;border:1px solid #24303a;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
  h2{margin:0;color:#fff;font-size:16px;border-bottom:1px solid #26313a;padding-bottom:8px}
  .row{display:flex;align-items:center;gap:8px}
  label{color:var(--muted);min-width:110px;font-size:13px}
  input[type=range]{flex:1}
  .btn{background:var(--accent);color:#fff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
  .btn-ghost{background:transparent;border:1px solid #2b3740;color:#cbd5e1;padding:6px 8px;border-radius:8px;cursor:pointer}
  .toggle{background:#1f2937;color:#cbd5e1;border:1px solid #2b3740;padding:6px 8px;border-radius:8px;cursor:pointer}
  .toggle.active{background:var(--accent);color:#fff;border-color:#1f6feb}
  .small{font-size:12px;color:var(--muted)}
  .kf-list{max-height:160px;overflow:auto;border:1px solid #22303a;padding:6px;border-radius:8px;background:#07121a}
  .kf-item{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid rgba(255,255,255,0.02)}
  .kf-item:last-child{border-bottom:0}
  .controls {display:flex;gap:8px}
  .section {padding:8px;border-radius:8px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02)}
</style>
</head>
<body>
<div class="wrap">
  <div class="sim">
    <canvas id="canvas" width="900" height="600"></canvas>
  </div>

  <div class="ui">
    <h2>Simulation — Rotating Boxes + Portal Keyframes</h2>

    <div class="row">
      <label>Gravity</label>
      <input id="gravity" type="range" min="0" max="1" step="0.01" value="0.25">
      <div class="small" id="gravityVal">0.25</div>
    </div>

    <div class="row">
      <label>Bounciness</label>
      <input id="bounce" type="range" min="0.2" max="1.0" step="0.01" value="0.85">
      <div class="small" id="bounceVal">0.85</div>
    </div>

    <div class="row">
      <label>Friction</label>
      <input id="friction" type="range" min="0.9" max="1.0" step="0.001" value="0.995">
      <div class="small" id="frictionVal">0.995</div>
    </div>

    <div class="section">
      <div style="display:flex;gap:8px;align-items:center">
        <button id="modeBall" class="toggle active">Add Ball</button>
        <button id="modeBox" class="toggle">Add Box</button>
        <button id="modeMove" class="toggle">Move</button>
        <button id="clearScene" class="btn-ghost" style="margin-left:auto">Clear</button>
      </div>
      <div class="small" style="margin-top:6px">Select a box (Move) to show rotation controls below.</div>
    </div>

    <div class="section">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <button id="intrusionToggle" class="toggle active">Intrusion Rendering: On</button>
        <label style="min-width:auto">Portal Keyframe Mode</label>
        <button id="toggleKeyframe" class="toggle">Off</button>
      </div>

      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <button id="addKF" class="btn">Add Keyframe</button>
        <button id="playKF" class="btn-ghost">Play</button>
        <button id="clearKFs" class="btn-ghost">Clear</button>
      </div>

      <div class="row">
        <label>Duration (s)</label>
        <input id="kfDuration" type="range" min="1" max="20" step="0.5" value="6">
        <div class="small" id="kfDurVal">6</div>
      </div>

      <div class="row" style="margin-top:8px"><label>Loop</label><button id="kfLoop" class="toggle active">On</button><div style="flex:1"></div></div>

      <div class="kf-list" id="kfList"></div>
    </div>

    <div class="section" id="boxControls" style="display:none">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div class="small">Selected box rotation</div>
        <div style="flex:1"></div>
        <button id="boxAutoRot" class="toggle">Auto-Rotate</button>
      </div>
      <div class="row">
        <label>Angle (deg)</label>
        <input id="boxAngle" type="range" min="-180" max="180" step="1" value="0">
        <div class="small" id="boxAngleVal">0</div>
      </div>
      <div class="row">
        <label>Angular Vel</label>
        <input id="boxAngVel" type="range" min="-1.0" max="1.0" step="0.01" value="0">
        <div class="small" id="boxAngVal">0</div>
      </div>
    </div>

    <div style="margin-top:auto" class="small">Notes: Rotating boxes use oriented-rectangle (SAT) collisions. Portal keyframes interpolate portal position, angle and length linearly.</div>
  </div>
</div>

<script>
/* Full simulation implementing:
   - rotating physics boxes (angle, angular velocity, per-box controls)
   - oriented box vs box collisions (SAT) and circle vs OBB collisions
   - portal keyframe animation mode with add/play/loop/clear & duration
   - intrusion rendering toggle fixed
   - teleport and portal clipping preserved
*/

// Canvas
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// UI
const gravitySlider = document.getElementById('gravity'), gravityVal = document.getElementById('gravityVal');
const bounceSlider = document.getElementById('bounce'), bounceVal = document.getElementById('bounceVal');
const frictionSlider = document.getElementById('friction'), frictionVal = document.getElementById('frictionVal');

gravitySlider.addEventListener('input', e => { cfg.gravity = +e.target.value; gravityVal.textContent = cfg.gravity; });
bounceSlider.addEventListener('input', e => { cfg.bounce = +e.target.value; bounceVal.textContent = cfg.bounce; });
frictionSlider.addEventListener('input', e => { cfg.friction = +e.target.value; frictionVal.textContent = cfg.friction; });

const modeBallBtn = document.getElementById('modeBall'), modeBoxBtn = document.getElementById('modeBox'), modeMoveBtn = document.getElementById('modeMove');
const clearSceneBtn = document.getElementById('clearScene');
modeBallBtn.addEventListener('click', ()=> setMode('add_ball'));
modeBoxBtn.addEventListener('click', ()=> setMode('add_box'));
modeMoveBtn.addEventListener('click', ()=> setMode('move'));
clearSceneBtn.addEventListener('click', ()=> { balls = []; physicsBoxes = []; obstacleBoxes = []; selectedBox = null; updateBoxControls(); });

const intrusionToggle = document.getElementById('intrusionToggle');
let intrusionEnabled = true;
intrusionToggle.addEventListener('click', ()=> { intrusionEnabled = !intrusionEnabled; intrusionToggle.classList.toggle('active', intrusionEnabled); intrusionToggle.textContent = `Intrusion Rendering: ${intrusionEnabled ? 'On' : 'Off'}`; });

const toggleKeyframeBtn = document.getElementById('toggleKeyframe');
let keyframeMode = false;
toggleKeyframeBtn.addEventListener('click', ()=> { keyframeMode = !keyframeMode; toggleKeyframeBtn.classList.toggle('active', keyframeMode); toggleKeyframeBtn.textContent = keyframeMode ? 'On' : 'Off'; });

// keyframe UI
const addKFBtn = document.getElementById('addKF'), playKFBtn = document.getElementById('playKF'), clearKFsBtn = document.getElementById('clearKFs');
const kfDuration = document.getElementById('kfDuration'), kfDurVal = document.getElementById('kfDurVal'), kfList = document.getElementById('kfList'), kfLoopBtn = document.getElementById('kfLoop');
let kfLoop = true, kfDurationSec = +kfDuration.value;
kfDuration.addEventListener('input', e => { kfDurationSec = +e.target.value; kfDurVal.textContent = kfDurationSec; });

// box controls
const boxControlsPane = document.getElementById('boxControls');
const boxAngleSlider = document.getElementById('boxAngle'), boxAngleVal = document.getElementById('boxAngleVal');
const boxAngVelSlider = document.getElementById('boxAngVel'), boxAngVal = document.getElementById('boxAngVal');
const boxAutoRotBtn = document.getElementById('boxAutoRot');
let boxAutoRotate = false;
boxAutoRotBtn.addEventListener('click', ()=> { boxAutoRotate = !boxAutoRotate; boxAutoRotBtn.classList.toggle('active', boxAutoRotate); });

// simulation config
const cfg = { gravity: 0.25, bounce: 0.85, friction: 0.995 };

// scene objects
let balls = [ { x:200, y:120, vx:3, vy:1, radius:16, color:'#00ffff', cooldown:0, prevU:{a:1,b:1}, flash:0 } ];
let physicsBoxes = [ { x:380, y:150, width:35, height:35, vx:-2, vy:0, angle:0, angular:0, cooldown:0, color:'#f59e0b', prevU:{a:1,b:1}, flash:0 } ];
let obstacleBoxes = [ { x:400, y:480, width:500, height:24, color:'#475569' } ];

// portals (static until keyframe animation controls them)
const portalA = { x:250, y:440, angle:-Math.PI/2, length:120, color:'#00aaff', id:'A', _warp:0, base:{x:250,y:440,angle:-Math.PI/2,length:120} };
const portalB = { x:580, y:200, angle:Math.PI, length:120, color:'#ff8800', id:'B', _warp:0, base:{x:580,y:200,angle:Math.PI,length:120} };
portalA.target = portalB; portalB.target = portalA;

// keyframe system
let keyframes = []; // array of {t:0..1, a:{x,y,angle,length}, b:{...}}
let kfPlaying = false, kfTime = 0;
addKFBtn.addEventListener('click', ()=> addKeyframe());
playKFBtn.addEventListener('click', ()=> { kfPlaying = !kfPlaying; playKFBtn.textContent = kfPlaying ? 'Pause' : 'Play'; });
clearKFsBtn.addEventListener('click', ()=> { keyframes = []; refreshKfList(); kfPlaying = false; playKFBtn.textContent = 'Play'; });

// helpers for keyframes
function capturePortalState(portal){ return { x: portal.x, y: portal.y, angle: portal.angle, length: portal.length }; }
function applyPortalState(portal, s){ portal.x = s.x; portal.y = s.y; portal.angle = s.angle; portal.length = s.length; }
function lerp(a,b,t){ return a + (b-a) * t; }
function lerpAngle(a,b,t){
  // shortest interpolation
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d * t;
}

function addKeyframe(){
  const a = capturePortalState(portalA);
  const b = capturePortalState(portalB);
  const t = keyframes.length === 0 ? 0 : 1; // we'll normalize by duration; t not used except order
  keyframes.push({ a, b, t });
  refreshKfList();
}
function refreshKfList(){
  kfList.innerHTML = '';
  keyframes.forEach((kf, i)=>{
    const div = document.createElement('div');
    div.className = 'kf-item';
    div.innerHTML = `<div><strong>KF ${i+1}</strong> — A: (${Math.round(kf.a.x)},${Math.round(kf.a.y)}) len ${Math.round(kf.a.length)} ▸ B: (${Math.round(kf.b.x)},${Math.round(kf.b.y)})</div>
                     <div style="display:flex;gap:6px"><button data-i="${i}" class="btn-ghost del">Del</button></div>`;
    kfList.appendChild(div);
  });
  kfList.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', e => {
    const i = +e.target.dataset.i;
    keyframes.splice(i,1);
    refreshKfList();
  }));
}

// animation playback interpolation
function evaluateKeyframes(tNorm){
  if (keyframes.length === 0) return null;
  if (keyframes.length === 1) {
    return { a: keyframes[0].a, b: keyframes[0].b };
  }
  // map tNorm [0,1] to segment
  const segCount = keyframes.length - 1;
  let segT = tNorm * segCount;
  const idx = Math.floor(segT);
  const local = segT - idx;
  const k0 = keyframes[Math.max(0, Math.min(keyframes.length-1, idx))];
  const k1 = keyframes[Math.max(0, Math.min(keyframes.length-1, idx+1))];
  // interpolate portal A and B
  const a = {
    x: lerp(k0.a.x, k1.a.x, local),
    y: lerp(k0.a.y, k1.a.y, local),
    angle: lerpAngle(k0.a.angle, k1.a.angle, local),
    length: lerp(k0.a.length, k1.a.length, local)
  };
  const b = {
    x: lerp(k0.b.x, k1.b.x, local),
    y: lerp(k0.b.y, k1.b.y, local),
    angle: lerpAngle(k0.b.angle, k1.b.angle, local),
    length: lerp(k0.b.length, k1.b.length, local)
  };
  return { a, b };
}

// interaction / adding objects / moving / selecting boxes
let currentMode = 'add_ball';
function setMode(m){
  currentMode = m;
  modeBallBtn.classList.toggle('active', m==='add_ball');
  modeBoxBtn.classList.toggle('active', m==='add_box');
  modeMoveBtn.classList.toggle('active', m==='move');
}
setMode('add_ball');

let dragging = null, dragMode = null, selectedBox = null, lastMouse = {x:0,y:0}, boxOffset = {x:0,y:0};
canvas.addEventListener('mousedown', e => {
  const m = canvasToCanvas(e);
  lastMouse = m;
  if (keyframeMode) return; // no object creation while keyframe mode locked (to keep workflows simple)
  if (currentMode === 'add_ball'){
    balls.push({ x:m.x, y:m.y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.4)*6, radius:10+Math.random()*12, color:`hsl(${Math.random()*360},85%,60%)`, cooldown:0, prevU:{a:1,b:1}, flash:0 });
    return;
  }
  if (currentMode === 'add_box'){
    physicsBoxes.push({ x:m.x, y:m.y, width:32+Math.random()*56, height:20+Math.random()*48, vx:0, vy:0, angle: (Math.random()-0.5)*0.6, angular:0, cooldown:0, color:`hsl(${Math.random()*60+20},75%,45%)`, prevU:{a:1,b:1}, flash:0 });
    setMode('move');
    return;
  }
  if (currentMode === 'move'){
    // select rotated boxes first
    for (let i = physicsBoxes.length - 1; i >= 0; i--){
      if (pointInOBB(m.x, m.y, physicsBoxes[i])) {
        selectedBox = physicsBoxes[i];
        dragMode = 'box_move';
        boxOffset = { x: m.x - selectedBox.x, y: m.y - selectedBox.y };
        updateBoxControls();
        return;
      }
    }
    // select ball
    for (let i = balls.length - 1; i >= 0; i--){
      const b = balls[i];
      if (Math.hypot(m.x - b.x, m.y - b.y) < b.radius){
        dragging = b; dragMode = 'ball_drag';
        b.vx = 0; b.vy = 0;
        return;
      }
    }
    // clear selection
    selectedBox = null; updateBoxControls();
  }
});
window.addEventListener('mousemove', e => {
  const m = canvasToCanvas(e);
  if (!dragMode) return;
  if (dragMode === 'ball_drag' && dragging){
    dragging.x = m.x; dragging.y = m.y;
    dragging.vx = (m.x - lastMouse.x) * 0.8; dragging.vy = (m.y - lastMouse.y) * 0.8;
  }
  if (dragMode === 'box_move' && selectedBox){
    selectedBox.x = m.x - boxOffset.x; selectedBox.y = m.y - boxOffset.y;
    selectedBox.vx = (m.x - lastMouse.x) * 0.8; selectedBox.vy = (m.y - lastMouse.y) * 0.8;
  }
  lastMouse = m;
});
window.addEventListener('mouseup', e => {
  if (dragMode === 'ball_drag' && dragging){ limitSpeed(dragging, 22); dragging.cooldown = 0; }
  if (dragMode === 'box_move' && selectedBox){ limitSpeed(selectedBox, 22); selectedBox.cooldown = 0; }
  dragging = null; dragMode = null;
});

// box control UI binding
boxAngleSlider.addEventListener('input', e => {
  if (!selectedBox) return;
  selectedBox.angle = (+e.target.value) * Math.PI/180;
  boxAngleVal.textContent = e.target.value;
});
boxAngVelSlider.addEventListener('input', e => {
  if (!selectedBox) return;
  selectedBox.angular = +e.target.value;
  boxAngVal.textContent = (+e.target.value).toFixed(2);
});
function updateBoxControls(){
  if (!selectedBox){ boxControlsPane.style.display = 'none'; return; }
  boxControlsPane.style.display = 'block';
  const deg = Math.round(selectedBox.angle * 180/Math.PI);
  boxAngleSlider.value = deg; boxAngleVal.textContent = deg;
  boxAngVelSlider.value = (selectedBox.angular || 0); boxAngVal.textContent = (selectedBox.angular || 0).toFixed(2);
  boxAutoRotBtn.classList.toggle('active', boxAutoRotate);
}

// small helpers
function canvasToCanvas(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left)*(canvas.width / r.width), y: (e.clientY - r.top)*(canvas.height / r.height) };
}
function limitSpeed(obj, max){
  const n = Math.hypot(obj.vx || 0, obj.vy || 0);
  if (n > max){ obj.vx = obj.vx / n * max; obj.vy = obj.vy / n * max; }
}

// local coords for portal detection
function getLocalCoordinates(entity, portal){
  const dx = entity.x - portal.x, dy = entity.y - portal.y;
  return { u: dx*Math.cos(portal.angle) + dy*Math.sin(portal.angle), v: -dx*Math.sin(portal.angle) + dy*Math.cos(portal.angle) };
}
function getLocalCoordsWithTransform(entity, px, py, ang){
  const dx = entity.x - px, dy = entity.y - py;
  return { u: dx*Math.cos(ang) + dy*Math.sin(ang), v: -dx*Math.sin(ang) + dy*Math.cos(ang) };
}

// portal intrusion warp
function computePortalWarp(portal){
  if (!intrusionEnabled){ portal._warp = 0; return 0; }
  const threshold = 140, maxWarp = 0.9;
  let best = 0;
  function consider(e, size){
    const loc = getLocalCoordinates(e, portal);
    if (Math.abs(loc.v) > portal.length/2 + 60) return;
    const distToPlane = Math.abs(loc.u) - size;
    const proximity = Math.max(0, threshold - distToPlane);
    const c = Math.max(0, Math.min(1, proximity/threshold));
    const warp = c*c * maxWarp;
    if (warp > best) best = warp;
  }
  for (let b of balls) consider(b, b.radius || 0);
  for (let box of physicsBoxes) consider(box, Math.hypot(box.width, box.height)/2);
  portal._warp = portal._warp === undefined ? best : (portal._warp*0.82 + best*0.18);
  return portal._warp;
}

// teleportation (unchanged semantics) — for boxes use bounding radius conservatively
function executeTeleport(entity, src, dest, isBox=false){
  const dTheta = dest.angle - src.angle + Math.PI;
  const dx = entity.x - src.x, dy = entity.y - src.y;
  const rx = dx*Math.cos(dTheta) - dy*Math.sin(dTheta); const ry = dx*Math.sin(dTheta) + dy*Math.cos(dTheta);
  const scaleFactor = dest.length / src.length;
  if (isBox){
    // transform center; rotate angle
    entity.angle = entity.angle + dTheta;
    entity.width *= scaleFactor; entity.height *= scaleFactor;
    entity.width = Math.max(10, Math.min(220, entity.width)); entity.height = Math.max(10, Math.min(220, entity.height));
  } else {
    entity.radius *= scaleFactor;
    entity.radius = Math.max(4, Math.min(75, entity.radius));
  }
  entity.x = dest.x + rx*scaleFactor;
  entity.y = dest.y + ry*scaleFactor;
  const rvx = entity.vx*Math.cos(dTheta) - entity.vy*Math.sin(dTheta);
  const rvy = entity.vx*Math.sin(dTheta) + entity.vy*Math.cos(dTheta);
  entity.vx = rvx; entity.vy = rvy;
  const pad = isBox ? Math.hypot(entity.width, entity.height)/2 : entity.radius;
  entity.x += Math.cos(dest.angle) * (pad + 3);
  entity.y += Math.sin(dest.angle) * (pad + 3);
  entity.cooldown = 8;
  entity.flash = 1.0;
}

// interception: object crossing portal plane (previous u>0 -> u<=0) — portal sweep not implemented when portals static
function processInterception(entity, isBox=false){
  const coordsA = getLocalCoordinates(entity, portalA);
  const coordsB = getLocalCoordinates(entity, portalB);
  const size = isBox ? Math.hypot(entity.width, entity.height)/2 : (entity.radius || 0);
  const prevA = (entity.prevU && typeof entity.prevU.a === 'number') ? entity.prevU.a : coordsA.u;
  const prevB = (entity.prevU && typeof entity.prevU.b === 'number') ? entity.prevU.b : coordsB.u;

  if ((entity.cooldown || 0) <= 0){
    if (Math.abs(coordsA.v) <= portalA.length/2 && Math.abs(coordsA.u) <= size && prevA > 0 && coordsA.u <= 0){
      executeTeleport(entity, portalA, portalB, isBox);
      if (!entity.prevU) entity.prevU = { a: coordsA.u, b: coordsB.u }; else { entity.prevU.a = coordsA.u; entity.prevU.b = coordsB.u; }
      return;
    }
    if (Math.abs(coordsB.v) <= portalB.length/2 && Math.abs(coordsB.u) <= size && prevB > 0 && coordsB.u <= 0){
      executeTeleport(entity, portalB, portalA, isBox);
      if (!entity.prevU) entity.prevU = { a: coordsA.u, b: coordsB.u }; else { entity.prevU.a = coordsA.u; entity.prevU.b = coordsB.u; }
      return;
    }
  }
  if (!entity.prevU) entity.prevU = { a: coordsA.u, b: coordsB.u };
  else { entity.prevU.a = coordsA.u; entity.prevU.b = coordsB.u; }
}

/* ---------- Collision: circle vs OBB and OBB vs OBB (SAT) ---------- */

// get rectangle vertices (in world coords) for an OBB
function obbVertices(box){
  const cx = box.x, cy = box.y, hw = box.width/2, hh = box.height/2, a = box.angle;
  const cos = Math.cos(a), sin = Math.sin(a);
  const pts = [
    { x: -hw, y: -hh },
    { x:  hw, y: -hh },
    { x:  hw, y:  hh },
    { x: -hw, y:  hh }
  ];
  return pts.map(p => ({ x: cx + p.x * cos - p.y * sin, y: cy + p.x * sin + p.y * cos }));
}

// project polygon vertices onto axis
function projectPoints(points, axis){
  let min = Infinity, max = -Infinity;
  for (const p of points){
    const proj = p.x*axis.x + p.y*axis.y;
    if (proj < min) min = proj;
    if (proj > max) max = proj;
  }
  return { min, max };
}
function overlapIntervals(a,b){ return Math.min(a.max, b.max) - Math.max(a.min, b.min); }

function normalizeAxis(v){ const len = Math.hypot(v.x, v.y); if (len === 0) return {x:0,y:0}; return { x: v.x/len, y: v.y/len }; }

// SAT test for box-box: returns minimum translation vector (mtv) or null
function boxBoxSAT(b1, b2){
  const v1 = obbVertices(b1), v2 = obbVertices(b2);
  const axes = [];
  // normals from edges of both boxes
  for (let i=0;i<4;i++){ const p1 = v1[i], p2 = v1[(i+1)%4]; axes.push(normalizeAxis({ x: p2.y - p1.y, y: -(p2.x - p1.x) })); }
  for (let i=0;i<4;i++){ const p1 = v2[i], p2 = v2[(i+1)%4]; axes.push(normalizeAxis({ x: p2.y - p1.y, y: -(p2.x - p1.x) })); }

  let minOverlap = Infinity, smallestAxis = null;
  for (const axis of axes){
    const proj1 = projectPoints(v1, axis);
    const proj2 = projectPoints(v2, axis);
    const o = overlapIntervals(proj1, proj2);
    if (o <= 0) return null; // separating axis found
    if (o < minOverlap){ minOverlap = o; smallestAxis = axis; }
  }
  // direction from b1->b2 center
  const dir = { x: b2.x - b1.x, y: b2.y - b1.y };
  const dot = dir.x*smallestAxis.x + dir.y*smallestAxis.y;
  const sign = dot < 0 ? -1 : 1;
  return { ax: smallestAxis.x * sign, ay: smallestAxis.y * sign, overlap: minOverlap };
}

// circle vs OBB: rotate circle center into box local coordinates, then do AABB circle test
function circleOBBCollision(circle, box){
  const cos = Math.cos(-box.angle), sin = Math.sin(-box.angle);
  const dx = circle.x - box.x, dy = circle.y - box.y;
  const localX = dx * cos - dy * sin;
  const localY = dx * sin + dy * cos;
  const hw = box.width/2, hh = box.height/2;
  const closestX = Math.max(-hw, Math.min(localX, hw));
  const closestY = Math.max(-hh, Math.min(localY, hh));
  const ddx = localX - closestX, ddy = localY - closestY;
  const dist = Math.hypot(ddx, ddy);
  if (dist >= circle.radius) return null;
  // convert collision normal back to world
  const nx_local = ddx / (dist || 1), ny_local = ddy / (dist || 1);
  const nx = nx_local * cos + ny_local * -sin;
  const ny = nx_local * sin + ny_local * cos;
  const penetration = circle.radius - dist;
  return { nx, ny, penetration };
}

/* ---------- Collisions resolution using above ---------- */

function resolveBallBallCollision(p1, p2){ // same as earlier fixed
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const dist = Math.hypot(dx,dy), minDist = p1.radius + p2.radius;
  if (dist >= minDist || dist === 0) return;
  const nx = dx/dist, ny = dy/dist;
  const overlap = (minDist - dist) / 2;
  const velocityNormalProj = (p2.vx - p1.vx) * nx + (p2.vy - p1.vy) * ny;
  if (velocityNormalProj < 0){
    const m1 = p1.radius*p1.radius, m2 = p2.radius*p2.radius;
    const impulse = -(1 + cfg.bounce) * velocityNormalProj / (1/m1 + 1/m2);
    applyCollisionFeedback(p1, -nx*overlap, -ny*overlap, -nx*impulse/m1, -ny*impulse/m1);
    applyCollisionFeedback(p2, nx*overlap, ny*overlap, nx*impulse/m2, ny*impulse/m2);
  } else {
    applyCollisionFeedback(p1, -nx*overlap, -ny*overlap, 0,0);
    applyCollisionFeedback(p2, nx*overlap, ny*overlap, 0,0);
  }
}

function resolveBallBoxCollision(ball, box){
  const res = circleOBBCollision(ball, box);
  if (!res) return;
  const { nx, ny, penetration } = res;
  // relative velocity
  const rvx = ball.vx - (box.vx || 0), rvy = ball.vy - (box.vy || 0);
  const velAlong = rvx*nx + rvy*ny;
  if (velAlong < 0){
    const m1 = ball.radius*ball.radius;
    const m2 = box.width*box.height;
    const impulse = -(1 + cfg.bounce) * velAlong / (1/m1 + 1/m2);
    applyCollisionFeedback(ball, nx*penetration, ny*penetration, nx*impulse/m1, ny*impulse/m1);
    applyCollisionFeedback(box, -nx*penetration*0.5, -ny*penetration*0.5, -nx*impulse/m2, -ny*impulse/m2);
  } else {
    applyCollisionFeedback(ball, nx*penetration, ny*penetration, 0,0);
    applyCollisionFeedback(box, -nx*penetration*0.5, -ny*penetration*0.5, 0,0);
  }
}

// OBB vs OBB
function resolveBoxBoxCollision(b1, b2){
  const sat = boxBoxSAT(b1, b2);
  if (!sat) return;
  const nx = sat.ax, ny = sat.ay, overlap = sat.overlap;
  // relative velocity along normal
  const rvx = (b2.vx || 0) - (b1.vx || 0), rvy = (b2.vy || 0) - (b1.vy || 0);
  const velAlong = rvx*nx + rvy*ny;
  if (velAlong < 0){
    const m1 = b1.width*b1.height, m2 = b2.width*b2.height;
    const imp = -(1 + cfg.bounce) * velAlong / (1/m1 + 1/m2);
    applyCollisionFeedback(b1, -nx*overlap*0.5, -ny*overlap*0.5, -nx*imp/m1, -ny*imp/m1);
    applyCollisionFeedback(b2, nx*overlap*0.5, ny*overlap*0.5, nx*imp/m2, ny*imp/m2);
  } else {
    applyCollisionFeedback(b1, -nx*overlap*0.5, -ny*overlap*0.5, 0,0);
    applyCollisionFeedback(b2, nx*overlap*0.5, ny*overlap*0.5, 0,0);
  }
}

// applyCollisionFeedback (maps clones to parents if needed)
function applyCollisionFeedback(participant, dpx, dpy, dvx, dvy){
  participant.x += dpx; participant.y += dpy;
  participant.vx = (participant.vx || 0) + dvx; participant.vy = (participant.vy || 0) + dvy;
  if (!participant.parent) return;
  if (!participant.isClone){
    participant.parent.x += dpx; participant.parent.y += dpy;
    participant.parent.vx = (participant.parent.vx||0) + dvx; participant.parent.vy = (participant.parent.vy||0) + dvy;
  } else {
    // map back via transform (same as earlier)
    const scaleFactor = (participant.type === 'b') ? (portalB.length/portalA.length) : (portalA.length/portalB.length);
    const dTheta = (participant.type === 'b') ? (portalB.angle - portalA.angle + Math.PI) : (portalA.angle - portalB.angle + Math.PI);
    const invTheta = -dTheta;
    const rx = (dpx/scaleFactor)*Math.cos(invTheta) - (dpy/scaleFactor)*Math.sin(invTheta);
    const ry = (dpx/scaleFactor)*Math.sin(invTheta) + (dpy/scaleFactor)*Math.cos(invTheta);
    const rvx = dvx*Math.cos(invTheta) - dvy*Math.sin(invTheta);
    const rvy = dvx*Math.sin(invTheta) + dvy*Math.cos(invTheta);
    participant.parent.x += rx; participant.parent.y += ry;
    participant.parent.vx = (participant.parent.vx||0) + rvx; participant.parent.vy = (participant.parent.vy||0) + rvy;
  }
}

/* ---------- collision helper: point in oriented box ---------- */
function pointInOBB(px, py, box){
  const cos = Math.cos(-box.angle), sin = Math.sin(-box.angle);
  const dx = px - box.x, dy = py - box.y;
  const lx = dx * cos - dy * sin;
  const ly = dx * sin + dy * cos;
  return Math.abs(lx) <= box.width/2 && Math.abs(ly) <= box.height/2;
}

/* ---------- clone frame (for portal view) ---------- */
function getCloneFrame(entity, isBox=false){
  const size = isBox ? Math.hypot(entity.width, entity.height)/2 : entity.radius;
  const locA = getLocalCoordinates(entity, portalA);
  if (Math.abs(locA.u) <= size && Math.abs(locA.v) <= portalA.length/2){
    const dTheta = portalB.angle - portalA.angle + Math.PI;
    const scaleFactor = portalB.length / portalA.length;
    // copy and transform
    return {
      x: portalB.x + ((entity.x - portalA.x)*Math.cos(dTheta) - (entity.y - portalA.y)*Math.sin(dTheta))*scaleFactor,
      y: portalB.y + ((entity.x - portalA.x)*Math.sin(dTheta) + (entity.y - portalA.y)*Math.cos(dTheta))*scaleFactor,
      vx: entity.vx*Math.cos(dTheta) - entity.vy*Math.sin(dTheta),
      vy: entity.vx*Math.sin(dTheta) + entity.vy*Math.cos(dTheta),
      radius: isBox ? 0 : entity.radius * scaleFactor,
      width: isBox ? entity.width * scaleFactor : 0,
      height: isBox ? entity.height * scaleFactor : 0,
      angle: isBox ? entity.angle + dTheta : undefined,
      isBox, isClone:true, type:'b', parent:entity
    };
  }
  const locB = getLocalCoordinates(entity, portalB);
  if (Math.abs(locB.u) <= size && Math.abs(locB.v) <= portalB.length/2){
    const dTheta = portalA.angle - portalB.angle + Math.PI;
    const scaleFactor = portalA.length / portalB.length;
    return {
      x: portalA.x + ((entity.x - portalB.x)*Math.cos(dTheta) - (entity.y - portalB.y)*Math.sin(dTheta))*scaleFactor,
      y: portalA.y + ((entity.x - portalB.x)*Math.sin(dTheta) + (entity.y - portalB.y)*Math.cos(dTheta))*scaleFactor,
      vx: entity.vx*Math.cos(dTheta) - entity.vy*Math.sin(dTheta),
      vy: entity.vx*Math.sin(dTheta) + entity.vy*Math.cos(dTheta),
      radius: isBox ? 0 : entity.radius * scaleFactor,
      width: isBox ? entity.width * scaleFactor : 0,
      height: isBox ? entity.height * scaleFactor : 0,
      angle: isBox ? entity.angle + dTheta : undefined,
      isBox, isClone:true, type:'a', parent:entity
    };
  }
  return null;
}

/* ---------- update & draw loop ---------- */

let last = performance.now();
function update(dt){
  // keyframe playback update
  if (kfPlaying && keyframes.length >= 1){
    kfTime += dt;
    const total = kfDurationSec * 1000;
    if (kfTime > total){
      if (kfLoop) kfTime = kfTime % total;
      else { kfPlaying = false; playKFBtn.textContent = 'Play'; kfTime = total; }
    }
    const tNorm = Math.max(0, Math.min(1, kfTime / total));
    const evalFrames = evaluateKeyframes(tNorm);
    if (evalFrames){
      applyPortalState(portalA, evalFrames.a);
      applyPortalState(portalB, evalFrames.b);
    }
  }

  // portal warp compute
  computePortalWarp(portalA); computePortalWarp(portalB);

  // physics: balls
  for (const b of balls){
    if (b.cooldown > 0) b.cooldown--;
    b.vy += cfg.gravity * dt * 0.06; // scaled
    b.vx *= Math.pow(cfg.friction, dt*0.06); b.vy *= Math.pow(cfg.friction, dt*0.06);
    b.x += b.vx * dt * 0.06; b.y += b.vy * dt * 0.06;
    processInterception(b, false);
    if (b.flash) b.flash = Math.max(0, b.flash - 0.02 * (dt/16));
    // boundaries
    if (b.y + b.radius > canvas.height && !checkBoundaryBypass(b, b.x, canvas.height, b.radius)){ b.y = canvas.height - b.radius; b.vy *= -cfg.bounce; }
    if (b.y - b.radius < 0 && !checkBoundaryBypass(b, b.x, 0, b.radius)){ b.y = b.radius; b.vy *= -cfg.bounce; }
    if (b.x + b.radius > canvas.width && !checkBoundaryBypass(b, canvas.width, b.y, b.radius)){ b.x = canvas.width - b.radius; b.vx *= -cfg.bounce; }
    if (b.x - b.radius < 0 && !checkBoundaryBypass(b, 0, b.y, b.radius)){ b.x = b.radius; b.vx *= -cfg.bounce; }
  }

  // physics: boxes (include angular motion)
  for (const box of physicsBoxes){
    if (box.cooldown > 0) box.cooldown--;
    box.vy += cfg.gravity * dt * 0.06;
    box.vx *= Math.pow(cfg.friction, dt*0.06); box.vy *= Math.pow(cfg.friction, dt*0.06);
    // auto-rotate?
    if (boxAutoRotate) box.angular *= 0.98; // damp
    box.angle += box.angular * (dt / 16);
    box.x += box.vx * dt * 0.06; box.y += box.vy * dt * 0.06;
    processInterception(box, true);
    if (box.flash) box.flash = Math.max(0, box.flash - 0.02 * (dt/16));

    const size = Math.hypot(box.width, box.height)/2;
    if (box.y + box.height/2 > canvas.height && !checkBoundaryBypass(box, box.x, canvas.height, size)){ box.y = canvas.height - box.height/2; box.vy *= -cfg.bounce; }
    if (box.y - box.height/2 < 0 && !checkBoundaryBypass(box, box.x, 0, size)){ box.y = box.height/2; box.vy *= -cfg.bounce; }
    if (box.x + box.width/2 > canvas.width && !checkBoundaryBypass(box, canvas.width, box.y, size)){ box.x = canvas.width - box.width/2; box.vx *= -cfg.bounce; }
    if (box.x - box.width/2 < 0 && !checkBoundaryBypass(box, 0, box.y, size)){ box.x = box.width/2; box.vx *= -cfg.bounce; }
  }

  // collision passes
  for (let pass=0; pass<2; pass++){
    const participants = [];
    for (const b of balls){ participants.push({isBox:false,isClone:false,parent:b,x:b.x,y:b.y,vx:b.vx,vy:b.vy,radius:b.radius}); const c = getCloneFrame(b,false); if (c) participants.push({isBox:false,isClone:true,parent:b,x:c.x,y:c.y,vx:c.vx,vy:c.vy,radius:c.radius,type:c.type}); }
    for (const box of physicsBoxes){ participants.push({isBox:true,isClone:false,parent:box,x:box.x,y:box.y,vx:box.vx,vy:box.vy,width:box.width,height:box.height,angle:box.angle}); const c = getCloneFrame(box,true); if (c) participants.push({isBox:true,isClone:true,parent:box,x:c.x,y:c.y,vx:c.vx,vy:c.vy,width:c.width,height:c.height,angle:c.angle,type:c.type}); }

    for (let i=0;i<participants.length;i++){
      for (let j=i+1;j<participants.length;j++){
        const p1 = participants[i], p2 = participants[j];
        if (!p1.isBox && !p2.isBox) resolveBallBallCollision(p1,p2);
        else if (p1.isBox && p2.isBox) resolveBoxBoxCollision(p1,p2);
        else {
          const ballObj = p1.isBox ? p2 : p1;
          const boxObj = p1.isBox ? p1 : p2;
          // adapt: participant box may not have proper angle for clone; ensure we map to parent
          // call resolveBallBoxCollision with real parent object (circle vs oriented box)
          resolveBallBoxCollision(ballObj.parent || ballObj, boxObj.parent || boxObj);
        }
      }
    }

    // obstacles
    for (const p of participants){
      for (const ob of obstacleBoxes){
        if (p.isBox) resolveBoxBoxCollision(p, { x:ob.x, y:ob.y, width:ob.width, height:ob.height, vx:0, vy:0, isStatic:true });
        else resolveBallBoxCollision(p, { x:ob.x, y:ob.y, width:ob.width, height:ob.height, isStatic:true });
      }
    }
  }
}

// boundary bypass check for portal edges (keeps existing behavior)
function checkBoundaryBypass(entity, borderX, borderY, size){
  const locA = getLocalCoordsWithTransform({x:borderX,y:borderY}, portalA.x, portalA.y, portalA.angle);
  const bLocA = getLocalCoordinates(entity, portalA);
  if (Math.abs(bLocA.u) <= size && Math.abs(bLocA.v) <= portalA.length/2 && Math.abs(locA.v) <= portalA.length/2) return true;
  const locB = getLocalCoordsWithTransform({x:borderX,y:borderY}, portalB.x, portalB.y, portalB.angle);
  const bLocB = getLocalCoordinates(entity, portalB);
  if (Math.abs(bLocB.u) <= size && Math.abs(bLocB.v) <= portalB.length/2 && Math.abs(locB.v) <= portalB.length/2) return true;
  return false;
}

/* ---------- drawing ---------- */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // background grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for (let x=0;x<canvas.width;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for (let y=0;y<canvas.height;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

  // see-through portal windows (with warp if enabled)
  drawSeeThroughWindow(portalA, portalB);
  drawSeeThroughWindow(portalB, portalA);

  // obstacles
  for (const ob of obstacleBoxes){
    ctx.save();
    ctx.fillStyle = ob.color; ctx.fillRect(ob.x - ob.width/2, ob.y - ob.height/2, ob.width, ob.height);
    ctx.restore();
  }

  // physics boxes (show clones when inside portals)
  for (const box of physicsBoxes){
    const isHeld = (box === selectedBox && dragMode === 'box_move');
    const size = Math.hypot(box.width, box.height)/2;
    const locA = getLocalCoordinates(box, portalA), locB = getLocalCoordinates(box, portalB);
    if (Math.abs(locA.u) <= size && Math.abs(locA.v) <= portalA.length/2){
      ctx.save(); applyPortalClip(portalA); drawOBB(box, isHeld); ctx.restore();
      const c = getCloneFrame(box, true);
      if (c){ ctx.save(); applyPortalClip(portalB); drawOBB(c, isHeld); ctx.restore(); }
    } else if (Math.abs(locB.u) <= size && Math.abs(locB.v) <= portalB.length/2){
      ctx.save(); applyPortalClip(portalB); drawOBB(box, isHeld); ctx.restore();
      const c = getCloneFrame(box, true);
      if (c){ ctx.save(); applyPortalClip(portalA); drawOBB(c, isHeld); ctx.restore(); }
    } else {
      drawOBB(box, isHeld);
    }
  }

  // balls & clones
  for (const b of balls){
    const isHeld = (b === dragging);
    const locA = getLocalCoordinates(b, portalA), locB = getLocalCoordinates(b, portalB);
    if (Math.abs(locA.u) <= b.radius && Math.abs(locA.v) <= portalA.length/2){
      ctx.save(); applyPortalClip(portalA); drawBall(b, isHeld); ctx.restore();
      const c = getCloneFrame(b, false);
      if (c){ ctx.save(); applyPortalClip(portalB); drawBall(c, isHeld); ctx.restore(); }
    } else if (Math.abs(locB.u) <= b.radius && Math.abs(locB.v) <= portalB.length/2){
      ctx.save(); applyPortalClip(portalB); drawBall(b, isHeld); ctx.restore();
      const c = getCloneFrame(b, false);
      if (c){ ctx.save(); applyPortalClip(portalA); drawBall(c, isHeld); ctx.restore(); }
    } else {
      drawBall(b, isHeld);
    }
  }

  // portal rims
  drawPortalRim(portalA); drawPortalRim(portalB);
}

function drawBall(b, active=false){
  ctx.save();
  ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(b.x - b.radius*0.3, b.y - b.radius*0.3, b.radius*0.05, b.x, b.y, b.radius);
  grad.addColorStop(0, '#fff'); grad.addColorStop(0.3, b.color); grad.addColorStop(1, '#031018');
  ctx.fillStyle = grad;
  ctx.shadowColor = b.color; ctx.shadowBlur = active ? 20 : 8;
  ctx.fill();
  if (b.flash && b.flash > 0.02){
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,255,255,${Math.min(0.9,b.flash)})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius+2, 0, Math.PI*2); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

function drawOBB(box, highlight=false){
  ctx.save();
  ctx.translate(box.x, box.y);
  ctx.rotate(box.angle || 0);
  ctx.fillStyle = box.color;
  ctx.fillRect(-box.width/2, -box.height/2, box.width, box.height);
  ctx.strokeStyle = highlight ? '#fff' : 'rgba(0,0,0,0.2)'; ctx.lineWidth = 2;
  ctx.strokeRect(-box.width/2, -box.height/2, box.width, box.height);
  if (box.flash && box.flash > 0.02){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85,box.flash)})`;
    ctx.fillRect(-box.width/2, -box.height/2, box.width, box.height);
  }
  ctx.restore();
}

function drawSeeThroughWindow(portal, target){
  ctx.save();
  ctx.translate(portal.x, portal.y);
  ctx.rotate(portal.angle);
  ctx.beginPath();
  ctx.rect(-canvas.width, -portal.length/2, canvas.width, portal.length);
  ctx.closePath();
  ctx.clip();

  // dark fill
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#02060b'; ctx.fill();

  // prepare transform to draw target scene into portal
  ctx.translate(portal.x, portal.y);
  ctx.rotate(portal.angle);

  const baseScale = portal.length / target.length;
  const warp = intrusionEnabled ? (portal._warp||0) : 0;
  const viewScaleX = baseScale * (1 + warp);
  const viewScaleY = baseScale;

  ctx.scale(viewScaleX, viewScaleY);
  ctx.scale(-1, -1);
  ctx.rotate(-target.angle);
  ctx.translate(-target.x, -target.y);

  // draw simple grid to show depth
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for (let x=0;x<canvas.width;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for (let y=0;y<canvas.height;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

  // draw remote obstacles, boxes, balls
  for (const ob of obstacleBoxes){ ctx.fillStyle = ob.color; ctx.fillRect(ob.x - ob.width/2, ob.y - ob.height/2, ob.width, ob.height); }
  for (const box of physicsBoxes) {
    ctx.save(); ctx.translate(box.x, box.y); ctx.rotate(box.angle || 0); ctx.fillStyle = box.color; ctx.fillRect(-box.width/2, -box.height/2, box.width, box.height); ctx.restore();
  }
  for (const b of balls){ ctx.beginPath(); ctx.fillStyle = b.color; ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill(); }

  ctx.restore();
}

function drawPortalRim(portal){
  ctx.save(); ctx.translate(portal.x, portal.y); ctx.rotate(portal.angle);
  const warp = intrusionEnabled ? (portal._warp||0) : 0;
  const glow = 8 + warp * 24; const strokeW = 4 + warp*3;
  ctx.shadowColor = portal.color; ctx.shadowBlur = glow;
  ctx.strokeStyle = portal.color; ctx.lineWidth = strokeW;
  ctx.beginPath(); ctx.moveTo(0, -portal.length/2); ctx.lineTo(0, portal.length/2); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.shadowBlur = 0;
  const cycle = Date.now()*0.008;
  for (let pos = -portal.length/2 + 8; pos <= portal.length/2 - 8; pos += 14){
    const shift = Math.sin(cycle + pos*0.12) * 3.5 * (1 + warp*0.3);
    ctx.beginPath(); ctx.moveTo(shift, pos-4); ctx.lineTo(shift, pos+4); ctx.stroke();
  }
  ctx.restore();
}

// portal clipping helper
function applyPortalClip(portal){
  ctx.beginPath();
  const span = 4000; const tx = -Math.sin(portal.angle), ty = Math.cos(portal.angle);
  const nx = Math.cos(portal.angle), ny = Math.sin(portal.angle);
  ctx.moveTo(portal.x - tx*span, portal.y - ty*span);
  ctx.lineTo(portal.x + tx*span, portal.y + ty*span);
  ctx.lineTo(portal.x + tx*span + nx*span, portal.y + ty*span + ny*span);
  ctx.lineTo(portal.x - tx*span + nx*span, portal.y - ty*span + ny*span);
  ctx.closePath(); ctx.clip();
}

/* ---------- main loop ---------- */

let lastTime = performance.now();
let kfPlaying = false;
function frame(now){
  const dt = now - lastTime; lastTime = now;
  if (kfPlaying){ kfTime += dt; const total = kfDurationSec*1000; if (kfTime > total){ if (kfLoop) kfTime %= total; else { kfPlaying=false; playKFBtn.textContent='Play'; kfTime = total; } } const tNorm = keyframes.length>0 ? Math.max(0, Math.min(1, kfTime / total)) : 0; const vals = evaluateKeyframes(tNorm); if (vals){ applyPortalState(portalA, vals.a); applyPortalState(portalB, vals.b); } }
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// handle playback UI toggles and variables
let kfPlayingState = false;
let kfTime = 0;
playKFBtn.addEventListener('click', ()=> {
  kfPlaying = !kfPlaying;
  kfPlaying ? (playKFBtn.textContent='Pause') : (playKFBtn.textContent='Play');
});
kfLoopBtn.addEventListener('click', ()=> { kfLoop = !kfLoop; kfLoopBtn.classList.toggle('active', kfLoop); });

// expose a few helpers to ease keyframe editing (re-evaluate on add)
function evaluateKeyframes(tNorm){
  return evaluateKeyframesInternal(tNorm);
}
function evaluateKeyframesInternal(tNorm){
  if (keyframes.length === 0) return null;
  if (keyframes.length === 1){
    return { a: keyframes[0].a, b: keyframes[0].b };
  }
  const segCount = keyframes.length - 1;
  let segT = tNorm * segCount;
  let idx = Math.floor(segT);
  if (idx >= segCount) idx = segCount - 1;
  const local = segT - idx;
  const k0 = keyframes[idx], k1 = keyframes[idx+1];
  const a = {
    x: lerp(k0.a.x, k1.a.x, local),
    y: lerp(k0.a.y, k1.a.y, local),
    angle: lerpAngle(k0.a.angle, k1.a.angle, local),
    length: lerp(k0.a.length, k1.a.length, local)
  };
  const b = {
    x: lerp(k0.b.x, k1.b.x, local),
    y: lerp(k0.b.y, k1.b.y, local),
    angle: lerpAngle(k0.b.angle, k1.b.angle, local),
    length: lerp(k0.b.length, k1.b.length, local)
  };
  return { a, b };
}

/* ---------- utility: keep UI variables and start state ---------- */

gravityVal.textContent = gravitySlider.value;
bounceVal.textContent = bounceSlider.value;
frictionVal.textContent = frictionSlider.value;
kfDurVal.textContent = kfDuration.value;
playKFBtn.textContent = 'Play';
kfLoopBtn.classList.add('active');

updateBoxControls();
